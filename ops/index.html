<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Refund approvals</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #1b1b1b; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; text-align: left; padding: 0.5rem; }
    button { margin-right: 0.4rem; }
    #note { width: 100%; max-width: 32rem; }
  </style>
</head>
<body>
  <h1>Pending refunds</h1>
  <form id="login">
    <input id="user" placeholder="user" autocomplete="username" />
    <input id="password" placeholder="password" type="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
  </form>
  <p id="status"></p>
  <label>Reject note <input id="note" /></label>
  <table>
    <thead>
      <tr><th>Amount</th><th>Order</th><th>Reason</th><th>Policy</th><th>Photos</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <h2>Timeline</h2>
  <pre id="timeline"></pre>
  <script>
    const status = document.getElementById("status");
    function taskId(item) { return item.task_id || item.id; }
    async function openTimeline(caseId) {
      const response = await fetch("/v1/cases/" + caseId + "/timeline", {
        credentials: "include",
        headers: { "X-Tenant-Id": "zepto" }
      });
      const body = await response.json();
      const lines = (body.items || []).map(function (item) {
        const data = item.data || {};
        if (item.kind === "message") return item.kind + " " + (data.role || "") + " " + (data.text || "");
        if (item.kind === "step") return item.kind + " " + (data.step_name || item.title) + " " + (data.status || "") + " attempt " + (data.attempt ?? "");
        return item.kind + " " + (item.title || "");
      });
      document.getElementById("timeline").textContent = response.ok ? lines.join("\n") : (body.detail || "timeline unavailable");
    }
    async function load() {
      const response = await fetch("/v1/approvals?status=pending", { credentials: "include", headers: { "X-Tenant-Id": "zepto" } });
      if (!response.ok) { status.textContent = "Sign in required"; return; }
      const body = await response.json();
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      for (const item of body.approvals || []) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${item.amount ?? ""}</td><td>${item.order_id ?? ""}</td><td>${item.reason ?? ""}</td><td>${item.policy_version ?? ""}</td><td>${item.photos_received ? "yes" : "no"}</td>`;
        tr.onclick = () => openTimeline(item.case_id);
        const approve = document.createElement("button");
        approve.textContent = "Approve";
        approve.onclick = (event) => { event.stopPropagation(); decide(taskId(item), "approve"); };
        const reject = document.createElement("button");
        reject.textContent = "Reject";
        reject.onclick = (event) => { event.stopPropagation(); decide(taskId(item), "reject"); };
        const cell = document.createElement("td");
        cell.append(approve, reject);
        tr.append(cell);
        rows.append(tr);
      }
    }
    async function decide(id, action) {
      const note = document.getElementById("note").value.trim();
      if (action === "reject" && !note) {
        status.textContent = "Reject requires a note";
        return;
      }
      const response = await fetch(`/v1/approvals/${id}/${action}`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Tenant-Id": "zepto" },
        body: JSON.stringify({ note })
      });
      const body = await response.json();
      status.textContent = response.ok ? (body.workflow_status || "updated") : (body.detail || "already decided");
      load();
    }
    document.getElementById("login").onsubmit = async (event) => {
      event.preventDefault();
      const response = await fetch("/v1/ops/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("user").value, password: document.getElementById("password").value })
      });
      status.textContent = response.ok ? "signed in" : "login failed";
      if (response.ok) load();
    };
  </script>
</body>
</html>
