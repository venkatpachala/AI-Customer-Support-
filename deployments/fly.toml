# Fly.io. Mock tools. Put OPS_PASSWORD, OPS_SESSION_SECRET, and DATABASE_URL
# in fly secrets. Do not commit those values.
app = "d2c-support"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TOOLS_MODE = "mock"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"
