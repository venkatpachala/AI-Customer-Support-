name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv
      - run: uv sync --frozen
      - name: Dependency scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Release gate
        env:
          TOOLS_MODE: mock
          OPS_PASSWORD: test-ops-password
          OPS_SESSION_SECRET: test-ops-secret
        run: uv run python -m evaluation.release_gate
