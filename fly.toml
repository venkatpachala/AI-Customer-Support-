# Fly.io app at the repo root. Secrets stay in `fly secrets`, not in git.
app = "d2c-support"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TOOLS_MODE = "mock"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"
