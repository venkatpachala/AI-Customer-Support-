services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/d2c_agent.db
      TOOLS_MODE: mock
    volumes:
      - ./data:/app/data
      - ./attachments:/app/attachments
      - ./rag/bm25_corpus.pkl:/app/rag/bm25_corpus.pkl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5