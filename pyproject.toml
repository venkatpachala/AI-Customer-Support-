[project]
name = "d2c"
version = "0.1.0"
description = "Multi-tenant AI customer support with grounded knowledge and supervised workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
    "fastapi>=0.139.2",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.9",
    "langsmith>=0.10.6",
    "pinecone>=7.3.0",
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "rank-bm25>=0.2.2",
    "redis>=8.0.1",
    "shopifyapi>=12.7.0",
    "sqlalchemy>=2.0.51",
    "stripe>=15.3.1",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
voice = ["pipecat-ai[openai,runner,silero,webrtc]>=1.7.0"]
evaluation = ["ragas>=0.4.3", "datasets>=5.0.1"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
